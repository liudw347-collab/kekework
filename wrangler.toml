# Cloudflare Pages 配置
# 部署时需要在 Cloudflare Dashboard 中绑定 D1 数据库（变量名 DB）
# 并设置环境变量 ACCESS_TOKEN

name = "keke-workbench"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./out"

# D1 数据库绑定（在 Cloudflare Dashboard 中也需要绑定）
# 也可以在 wrangler.toml 中绑定：
# [[d1_databases]]
# binding = "DB"
# database_name = "keke-workbench-db"
# database_id = "<在 Cloudflare 创建数据库后填入>"

# 环境变量（建议在 Cloudflare Dashboard 中设置，更安全）
# [vars]
# ACCESS_TOKEN = "your-secret-token"
